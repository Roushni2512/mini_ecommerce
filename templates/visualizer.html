{% extends 'base.html' %}

{% block title %}Desk Studio - Mini Shop{% endblock %}

{% block content %}
<div class="visualizer-container">
    <div class="sidebar">
        <h2>Collection</h2>
        <p>Drag items to your desk.</p>
        <div class="draggable-list">
            {% for product in products %}
            <div class="draggable-item" draggable="true" data-id="{{ product.id }}" data-img="{{ product.image_url }}">
                <img src="{{ product.image_url }}" alt="{{ product.name }}">
                <span>{{ product.name }}</span>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="canvas-area">
        <h2>Your Desk Setup</h2>
        <div id="desk-canvas" class="desk-canvas">
            <p class="placeholder-text">Drop items here to arrange</p>
        </div>

        <div class="canvas-controls">
            <button onclick="clearCanvas()">Clear Desk</button>
            <button class="primary-btn" onclick="addAllToCart()">Add Setup to Cart</button>
        </div>
    </div>
</div>

<script>
    const draggables = document.querySelectorAll('.draggable-item');
    const canvas = document.getElementById('desk-canvas');
    let draggedItem = null;

    // Sidebar Draggables
    draggables.forEach(draggable => {
        draggable.addEventListener('dragstart', () => {
            draggedItem = draggable;
            draggable.classList.add('dragging');
        });

        draggable.addEventListener('dragend', () => {
            draggable.classList.remove('dragging');
            draggedItem = null;
        });
    });

    // Canvas Drop Zone
    canvas.addEventListener('dragover', e => {
        e.preventDefault();
    });

    canvas.addEventListener('drop', e => {
        e.preventDefault();
        const bbox = canvas.getBoundingClientRect();
        const x = e.clientX - bbox.left;
        const y = e.clientY - bbox.top;

        if (draggedItem) {
            // Create new element on canvas
            const imgUrl = draggedItem.dataset.img;
            const id = draggedItem.dataset.id;

            const newEl = document.createElement('div');
            newEl.className = 'canvas-item';
            newEl.dataset.id = id;
            newEl.style.left = `${x - 50}px`;
            newEl.style.top = `${y - 50}px`;

            const img = document.createElement('img');
            img.src = imgUrl;
            newEl.appendChild(img);

            // Allow moving items ON the canvas
            newEl.onmousedown = dragMouseDown;

            canvas.appendChild(newEl);

            // Remove placeholder
            const placeholder = canvas.querySelector('.placeholder-text');
            if (placeholder) placeholder.style.display = 'none';
        }
    });

    // Function to move items on canvas
    function dragMouseDown(e) {
        e.preventDefault();
        let elm = e.target.closest('.canvas-item');
        let pos3 = e.clientX;
        let pos4 = e.clientY;

        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;

        function elementDrag(e) {
            e.preventDefault();
            let pos1 = pos3 - e.clientX;
            let pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elm.style.top = (elm.offsetTop - pos2) + "px";
            elm.style.left = (elm.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    function clearCanvas() {
        canvas.innerHTML = '<p class="placeholder-text">Drop items here to arrange</p>';
    }

    async function addAllToCart() {
        const items = canvas.querySelectorAll('.canvas-item');
        if (items.length === 0) {
            alert("Your desk is empty!");
            return;
        }

        let count = 0;
        for (const item of items) {
            try {
                await fetch(`/add_to_cart/${item.dataset.id}`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                count++;
            } catch (e) {
                console.error(e);
            }
        }

        location.reload(); // Quick refresh to update cart
    }
</script>

<style>
    /* Inline styles for specific page logic, major styles in style.css */
    .visualizer-container {
        display: flex;
        height: 85vh;
        border-top: 1px solid #eee;
    }

    .sidebar {
        width: 300px;
        background: #fdfdfd;
        border-right: 1px solid #eee;
        padding: 2rem;
        overflow-y: auto;
    }

    .draggable-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 2rem;
    }

    .draggable-item {
        background: white;
        padding: 0.5rem;
        border: 1px solid #eee;
        cursor: grab;
        text-align: center;
        font-size: 0.8rem;
    }

    .draggable-item img {
        width: 100%;
        height: 80px;
        object-fit: cover;
        margin-bottom: 0.5rem;
    }

    .canvas-area {
        flex: 1;
        background: #f5f5f7;
        padding: 2rem;
        position: relative;
    }

    .desk-canvas {
        width: 100%;
        height: 70%;
        /* Fixed height for canvas */
        background: white;
        border: 2px dashed #ddd;
        position: relative;
        overflow: hidden;
        margin-top: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .canvas-item {
        position: absolute;
        width: 150px;
        cursor: move;
    }

    .canvas-item img {
        width: 100%;
        pointer-events: none;
        /* Prevent browser image drag behavior */
    }

    .placeholder-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ccc;
        font-size: 1.5rem;
        pointer-events: none;
    }

    .canvas-controls {
        margin-top: 2rem;
        display: flex;
        gap: 1rem;
    }
</style>
{% endblock %}
