{% extends 'base.html' %}

{% block title %}Login - Mini Shop{% endblock %}

{% block content %}
<div class="form-container">
    <h1 style="font-size: 2rem; margin-bottom: 2rem;">Login</h1>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p style="margin-top: 1.5rem; color: #666; font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: #000; font-weight: 600;">Register
            here</a>
    </p>
</div>
{% endblock %}
